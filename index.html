<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회천청소년문화의집 - 청운위 위원장 도전기</title>
    <style>
        :root { --p: #4f46e5; --s: #10b981; --d: #ef4444; }
        body { font-family: sans-serif; background: #f3f4f6; color: #1f2937; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #g { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; box-sizing: border-box; min-height: 450px; display: flex; flex-direction: column; justify-content: space-between; }
        .hl { font-size: 14px; color: #6b7280; text-decoration: none; margin-bottom: 10px; display: inline-block; }
        .sb { display: flex; justify-content: space-between; background: #e5e7eb; padding: 10px 15px; border-radius: 10px; font-weight: bold; margin-bottom: 20px; }
        .cb { flex-grow: 1; display: flex; justify-content: center; align-items: center; font-size: 18px; line-height: 1.6; margin-bottom: 25px; word-break: keep-all; white-space: pre-wrap; }
        .bc { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        button, .bl { padding: 15px; font-size: 16px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; transition: all 0.2s; width: 100%; box-sizing: border-box; }
        .bn { background: var(--p); color: white; }
        .by { background: var(--s); color: white; }
        .bnx { background: var(--d); color: white; }
        .bl { background: #1e293b; color: white; text-decoration: none; display: block; margin-top: 15px; }
        .ct { font-size: 10px; color: #d1d5db; margin-top: 20px; }
        .h { display: none !important; }
    </style>
</head>
<body>
<div id="g">
    <div>
        <a href="https://hcyouth.kr" target="_blank" class="hl">🏢 회천청소년문화의집 바로가기</a>
        <div id="sa" class="sb h"><span id="pg"></span><span id="sc"></span></div>
        <div id="cb" class="cb">로딩 중...</div>
    </div>
    <div>
        <div id="ba" class="bc"></div>
        <div id="cra" class="ct h">제미나이x영훈</div>
    </div>
</div>
<script>
    const st = [
        "시험이 끝난 주말, 오랜만에 회천청소년문화의집을 찾았다. 코인노래방도 가고 보드게임도 하려고 했는데... 어라? 오늘따라 시설이 조금 심심하고 지루하게 느껴진다. 🤔",
        "대기실 소파에 앉아 있는데 선생님이 다가와 말을 건넨다.\n\n\"안녕! 우리가 시설을 더 재밌게 바꿀 청소년 위원장을 찾고 있어! 청소년운영위원회(청운위)가 되면 너희가 직접 시설도 모니터링하고 축제도 기획할 수 있단다. 네가 회천청소년문화의집을 멋지게 바꿔볼래?\""
    ];
    const qz = [
        { t: "📢 [시설 모니터링]\n\"청소년들이 코인노래방과 보드게임방을 더 쾌적하게 쓸 수 있도록, 청운위가 직접 정기 시설 점검을 진행하고 환경 개선을 건의할까요?\"", y: { s: 15, m: "정답! 청운위의 가장 중요한 역할 중 하나는 청소년의 눈높이로 시설을 모니터링하고 건의하는 일입니다. (만족도 +15%)" }, n: { s: -15, m: "앗... 청운위가 시설에 관심을 끄자 이용 환경이 불편해졌다는 불만이 쏟아집니다. (만족도 -15%)" } },
        { t: "🎨 [프로그램 기획]\n\"회천 청소년들이 가장 좋아하는 'e스포츠 대회'와 'DIY 원데이 클래스'를 청운위가 직접 기획하고 예산까지 짜서 운영해 볼까요?\"", y: { s: 20, m: "대성공! 청소년들이 직접 기획한 덕분에 참가 신청이 5분 만에 마감되었습니다! (만족도 +20%)" }, n: { s: -10, m: "틀에 박힌 기존 프로그램만 반복되자 청소년들이 축제에 흥미를 잃어갑니다. (만족도 -10%)" } },
        { t: "🗣️ [기관장 간담회]\n\"연 1회 이상 열리는 관장님과의 간담회 자리! 청소년들이 원하던 '스터디 공간 확대' 의견을 당당하게 제안해 볼까요?\"", y: { s: 20, m: "좋습니다! 관장님이 의견을 적극 수용하여 자치활동실이 멋진 카공족 공간으로 리모델링됩니다! (만족도 +20%)" }, n: { s: -15, m: "소중한 소통 기회를 놓쳤습니다. 청소년들의 불편 사항이 해결되지 않고 묻힙니다. (만족도 -15%)" } },
        { t: "🤝 [교류 활동]\n\"다른 지역 청소년수련관의 청운위 친구들을 만나 아이디어를 교환하고 연합 축제를 열어볼까요?\"", y: { s: 15, m: "최고예요! 다른 기관 위원들과 친해지고, 훨씬 더 넓은 시야를 갖게 되었습니다! (만족도 +15%)" }, n: { s: -5, m: "우리끼리만 활동하니 우물 안 개구리가 된 느낌입니다. 새로운 아이디어가 부족해지네요. (만족도 -5%)" } }
    ];
    let cSt = 'story', sIdx = 0, qIdx = 0, sat = 50;
    const $ = id => document.getElementById(id);

    function btn(cl, txt, fn) {
        const b = document.createElement('button'); b.className = cl; b.innerText = txt; b.onclick = fn; return b;
    }

    function up() {
        $('ba').innerHTML = ''; $('cra').classList.add('h');
        if (cSt === 'story') {
            $('sa').classList.add('h'); $('cb').innerText = st[sIdx];
            $('ba').appendChild(btn('bn', sIdx === st.length - 1 ? '🔥 청운위 위원장 취임하고 시작하기' : '다음 이야기 ▶', () => {
                if (sIdx < st.length - 1) { sIdx++; up(); } else { cSt = 'quiz'; up(); }
            }));
        } else if (cSt === 'quiz') {
            $('sa').classList.remove('h'); $('pg').innerText = `질문 ${qIdx + 1}/${qz.length}`; $('sc').innerText = `청소년 만족도: ${sat}%`; $('cb').innerText = qz[qIdx].t;
            $('ba').appendChild(btn('by', '⭕ 찬성 (YES)', () => sel('y')));
            $('ba').appendChild(btn('bnx', '❌ 반대 (NO)', () => sel('n')));
        }
    }

    function sel(k) {
        let eff = qz[qIdx][k]; sat = Math.max(0, Math.min(100, sat + eff.s));
        cSt = 'feedback'; $('sc').innerText = `청소년 만족도: ${sat}%`; $('cb').innerText = eff.m; $('ba').innerHTML = '';
        $('ba').appendChild(btn('bn', '다음 단계로 ▶', () => {
            if (qIdx < qz.length - 1) { qIdx++; cSt = 'quiz'; up(); } else { end(); }
        }));
    }

    function end() {
        $('sa').classList.add('h'); $('cra').classList.remove('h');
        let t = "", d = `최종 만족도: ${sat}%\n\n`;
        if (sat >= 80) { t = "👑 [레전드] 회천의 명예 관장급 위원장"; d += "당신은 청소년들의 목소리에 귀를 기울여 회천청소년문화의집을 최고의 핫플레이스로 만들었습니다! 관장님과 청소년들 모두가 당신을 찬양합니다!"; }
        else if (sat >= 50) { t = "👍 [우수] 든든하고 성실한 위원장"; d += "큰 문제 없이 안정적으로 문화의 집을 이끌었습니다. 청소년들이 의견이 필요할 때마다 항상 당신을 신뢰하며 찾아올 것입니다!"; }
        else { t = "😢 [라떼] 고집불통 위원장"; d += "청소년들의 요구를 외면하다가 문화의 집이 텅 비어버렸습니다... 청소년들의 진짜 목소리를 대변하러 다시 도전해보는 건 어떨까요?"; }
        $('cb').innerHTML = `<strong style="font-size:20px; color:var(--p);">${t}</strong><br><br>${d.replace(/\n/g, '<br>')}`;
        $('ba').appendChild(btn('bn', '🔄 다시 도전하기', () => { sIdx = qIdx = 0; sat = 50; cSt = 'story'; up(); }));
        const l = document.createElement('a'); l.className = 'bl'; l.href = 'https://hcyouth.kr'; l.target = '_blank'; l.innerText = '📢 회천청운위 지원하러 가기'; $('ba').appendChild(l);
    }
    up();
</script>
</body>
</html>
